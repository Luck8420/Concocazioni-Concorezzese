<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Convocazioni">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Convocazioni Concorezzese</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f4f4;--fg:#231a1a;--card:#fff;--bd:#dccfcf;--ac:#c8102e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1212;--fg:#f1e8e8;--card:#271b1b;--bd:#43302f;--ac:#e0344f}}
:root[data-theme="dark"]{--bg:#1a1212;--fg:#f1e8e8;--card:#271b1b;--bd:#43302f;--ac:#e0344f}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px;max-width:640px}
h1{font-size:20px;margin:4px 0 10px;display:flex;gap:10px;align-items:center}
h1 img{width:38px;height:38px;border-radius:6px}
h2{font-size:15px;margin:18px 0 6px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font-size:15px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
label.f{display:block;font-size:13px;margin:10px 0 3px;opacity:.8}
input[type=text],input[type=date],input[type=time],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.row>div{min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;line-height:1.2}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:6px 0}
.chk label{display:flex;gap:7px;align-items:center;font-size:14px;padding:5px 2px}
.chk input{width:18px;height:18px;accent-color:var(--ac);flex:none}
.it{display:flex;align-items:center;gap:2px}.it label{flex:1;min-width:0}.it .x{border:0;background:none;color:var(--ac);font-size:18px;padding:4px 8px}
.mini{display:flex;gap:6px;margin:4px 0}
.mini button,.add button{padding:7px 12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px}
details{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--card)}
summary{font-size:14px;cursor:pointer}
.add{display:flex;gap:6px;margin-top:4px}
canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px;background:#fff}
button.main{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd);font-weight:400}
.hint{font-size:13px;opacity:.75}
textarea{width:100%;min-height:90px;margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
</style></head><body>
<h1><img id="lg" alt="">Convocazioni · Esordienti U12</h1>
<div class="seg"><button id="tB">Squadra Bianca</button><button id="tR">Squadra Rossa</button></div>

<div class="mini" style="margin-top:12px"><button id="ed">✏️ Modifica elenchi</button><button id="rs" style="display:none">Ripristina originali</button></div>
<h2>Giocatori <span id="cnt" style="text-transform:none;opacity:.8"></span></h2>
<div class="mini"><button id="all">Tutti</button><button id="none">Nessuno</button></div>
<div class="chk" id="pOwn"></div>
<div class="add"><input type="text" id="nP" placeholder="Nuovo ragazzo (COGNOME NOME)"><button id="aP">Aggiungi</button></div>
<details><summary id="sOth">Aggiungi ragazzi dell'altra squadra</summary><div class="chk" id="pOth"></div></details>

<h2>Staff</h2>
<label class="f">Mister</label><div class="chk" id="sM"></div>
<div class="add"><input type="text" id="nM" placeholder="Nuovo mister"><button id="aM">Aggiungi</button></div>
<label class="f">Dirigenti</label><div class="chk" id="sD"></div>
<div class="add"><input type="text" id="nD" placeholder="Nuovo dirigente"><button id="aD">Aggiungi</button></div>

<h2>Evento</h2>
<div class="row"><div><label class="f">Tipo</label><select id="tipo"><option>Amichevole</option><option>Campionato</option><option>Torneo</option></select></div>
<div><label class="f">Avversario/Torneo</label><input type="text" id="avv"></div></div>
<label class="f">Data</label><input type="date" id="data">
<div class="seg" style="margin-top:10px"><button id="cs">🏠 Casa</button><button id="tr">🚌 Trasferta</button></div>
<label class="f">Luogo</label><input type="text" id="luogo">
<a id="mp" target="_blank" rel="noopener" href="https://www.google.com/maps" style="display:inline-block;margin-top:6px;font-size:14px;color:var(--ac)">📍 Cerca su Google Maps</a>
<div class="row"><div><label class="f">Ritrovo</label><input type="time" id="rit"></div>
<div><label class="f">Inizio gara</label><input type="time" id="ini"></div></div>

<h2>Convocazione</h2>
<canvas id="cv" width="1080" height="1400"></canvas>
<button class="main" id="bp">Scarica immagine (PNG)</button>
<button class="main alt" id="bf">Scarica PDF</button>
<button class="main alt" id="cp">Copia testo per WhatsApp</button>
<p class="hint" id="hint">Se i pulsanti di download non sono disponibili, tieni premuta l'immagine per salvarla.</p>
<textarea id="txt" readonly></textarea>
